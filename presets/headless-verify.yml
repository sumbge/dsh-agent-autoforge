- insert:
    - id: agent-autoforge-tools
      name: '@local/dsh-agent-autoforge'
      config:
        python: python
        cwd: C:\Users\32535\Desktop\dsh\autoforge-svc-gw
        home: C:\Users\32535\Desktop\dsh\autoforge-svc-gw\.data
        skills: C:\Users\32535\AppData\Local\autoforge\skills
