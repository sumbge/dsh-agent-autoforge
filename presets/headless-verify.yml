# CLI 验证用 overlay：headless profile + autoforge 服务 + 本机网关路由。
- insert:
    - id: agent-autoforge-tools
      name: '@local/dsh-agent-autoforge'
      config:
        # Replace these four with paths on your own machine (or delete them and
        # let the plugin derive: cwd beside lib/, home/skills under
        # %LOCALAPPDATA%\autoforge). `python` here is the command name the
        # plugin probes; on Windows prefer `py` or an absolute interpreter.
        python: python
        cwd: C:\autoforge\service
        home: C:\autoforge\.data
        skills: C:\autoforge\skills
        timeoutMs: 600000
    - id: llm-xdpool-verify
      name: '@local/dsh-agent-autoforge/xdpool-route'
      config:
        distribution: expiry
- id: agent-default-model
  config:
    provider: xdpool
    model: deepseek-v4.1-flash
